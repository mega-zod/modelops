services:
  - type: web
    name: modelops-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_PATH
        value: /app/data/modelops.db
      - key: MODEL_OPS_API_KEY
        sync: false
      - key: EXECUTION_APPROVAL_TOKEN
        sync: false
