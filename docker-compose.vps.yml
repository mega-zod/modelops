services:
  modelops-ai:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_PATH: /app/data/modelops.db
    volumes:
      - modelops-data:/app/data
      - modelops-generated:/app/generated
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file:
      - .env.vps
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      modelops-ai:
        condition: service_healthy
    restart: unless-stopped

volumes:
  modelops-data:
  modelops-generated:
  caddy-data:
  caddy-config:
